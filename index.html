<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бестиарий D&D 5e24 — Город Тысячи Воронов</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/cutout.png" type="image/png">
    <!-- Системные шрифты (без внешних запросов) -->
</head>
<body>
    <div id="book-root" class="book-root">
        <!-- Контейнер книги (одна страница, а не разворот) -->
        <div id="book-container" class="book-container"></div>

        <!-- Навигационная панель -->
        <nav class="book-nav" id="bookNav" aria-label="Навигация по книге">
            <button class="nav-btn nav-prev" id="navPrev" aria-label="Предыдущая страница" title="Предыдущая (←)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <div class="nav-center">
                <span class="page-indicator" id="pageIndicator">Обложка</span>
                <button class="nav-btn thumbnails-btn" id="thumbnailsBtn" aria-label="Оглавление" title="Оглавление (T)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                    </svg>
                </button>
                <button class="nav-btn edit-btn" id="btnEditMode" aria-label="Режим редактирования" title="Редактирование (E)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>
            </div>
            <button class="nav-btn nav-next" id="navNext" aria-label="Следующая страница" title="Следующая (→)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </nav>

        <!-- Панель миниатюр (оглавление) -->
        <aside class="thumbnails-panel" id="thumbnailsPanel" aria-label="Миниатюры страниц">
            <header class="thumbnails-header">
                <h3>Оглавление</h3>
                <button class="thumbnails-close" id="thumbnailsClose" aria-label="Закрыть">×</button>
            </header>
            <div class="thumbnails-grid" id="thumbnailsGrid"></div>
        </aside>

        <!-- Загрузка -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <p>Загрузка бестиария…</p>
        </div>
    </div>

    <!-- Модалка редактирования -->
    <dialog class="modal" id="editModal">
        <form class="modal-form" id="editForm">
            <header class="modal-header">
                <h3 id="modalTitle">Редактировать монстра</h3>
                <button type="button" class="modal-close" id="modalClose">&times;</button>
            </header>
            <div class="modal-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="editName">Имя *</label>
                        <input type="text" id="editName" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="editNameEn">Имя (английское)</label>
                        <input type="text" id="editNameEn" name="nameEn">
                    </div>
                    <div class="form-group">
                        <label for="editCr">ОП (CR) *</label>
                        <input type="text" id="editCr" name="cr" required placeholder="напр. 1/4, 5, 17">
                    </div>
                    <div class="form-group">
                        <label for="editType">Тип *</label>
                        <select id="editType" name="type" required>
                            <option value="">Выберите тип</option>
                            <option value="aberration">Аберрация</option>
                            <option value="beast">Зверь</option>
                            <option value="celestial">Небожитель</option>
                            <option value="construct">Конструкт</option>
                            <option value="dragon">Дракон</option>
                            <option value="elemental">Элементаль</option>
                            <option value="fey">Фея</option>
                            <option value="fiend">Исчадие</option>
                            <option value="giant">Великан</option>
                            <option value="humanoid">Гуманоид</option>
                            <option value="monster">Монстр</option>
                            <option value="monstrosity">Монструозность</option>
                            <option value="ooze">Удой</option>
                            <option value="plant">Растение</option>
                            <option value="undead">Нежить</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editTypeRu">Тип (Русский для панели)</label>
                        <input type="text" id="editTypeRu" name="typeRu" placeholder="напр. Аберрация, Монстр, Гуманоид, Нежить, Дракон, Зверь, Удой, Растение">
                    </div>
                    <div class="form-group">
                        <label for="editSize">Размер *</label>
                        <select id="editSize" name="size" required>
                            <option value="">Выберите размер</option>
                            <option value="Tiny">Крошечный</option>
                            <option value="Small">Маленький</option>
                            <option value="Medium">Средний</option>
                            <option value="Large">Большой</option>
                            <option value="Huge">Огромный</option>
                            <option value="Gargantuan">Громадный</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editAlignment">Мировоззрение</label>
                        <input type="text" id="editAlignment" name="alignment" placeholder="напр. Хаотично-злой">
                    </div>
                    <div class="form-group">
                        <label for="editSource">Источник</label>
                        <input type="text" id="editSource" name="source" placeholder="напр. MM24, dnd.su">
                    </div>
                    <div class="form-group">
                        <label for="editIllustration">URL иллюстрации</label>
                        <input type="url" id="editIllustration" name="illustration" placeholder="https://...">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="editDescription">Описание</label>
                    <textarea id="editDescription" name="description" rows="6" placeholder="Описание монстра, лор, внешность…"></textarea>
                </div>

                <fieldset class="form-group full-width">
                    <legend>Характеристики (Ability Scores)</legend>
                    <div class="abilities-grid" id="abilitiesGrid">
                        <div class="ability-input"><label>СИЛ <input type="number" name="str" min="1" max="30" value="10"></label></div>
                        <div class="ability-input"><label>ЛОВ <input type="number" name="dex" min="1" max="30" value="10"></label></div>
                        <div class="ability-input"><label>ТЕЛ <input type="number" name="con" min="1" max="30" value="10"></label></div>
                        <div class="ability-input"><label>ИНТ <input type="number" name="int" min="1" max="30" value="10"></label></div>
                        <div class="ability-input"><label>МДР <input type="number" name="wis" min="1" max="30" value="10"></label></div>
                        <div class="ability-input"><label>ХАР <input type="number" name="cha" min="1" max="30" value="10"></label></div>
                    </div>
                </fieldset>

                <fieldset class="form-group full-width">
                    <legend>Скорость (Speed)</legend>
                    <div class="speed-grid" id="speedGrid">
                        <div class="speed-input"><label>Ходьба <input type="number" name="walk" min="0" value="30" step="5"> фт</label></div>
                        <div class="speed-input"><label>Полёт <input type="number" name="fly" min="0" value="0" step="5"> фт</label></div>
                        <div class="speed-input"><label>Плавание <input type="number" name="swim" min="0" value="0" step="5"> фт</label></div>
                        <div class="speed-input"><label>Лазание <input type="number" name="climb" min="0" value="0" step="5"> фт</label></div>
                    </div>
                </fieldset>

                <div class="form-group full-width">
                    <label for="editSkills">Навыки (по одному на строку: Навык +бонус)</label>
                    <textarea id="editSkills" name="skills" rows="4" placeholder="Скрытность +5&#10;Восприятие +3"></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="editResistances">Сопротивления урону (через запятую)</label>
                    <input type="text" id="editResistances" name="resistances" placeholder="огонь, холод, яд">
                </div>

                <div class="form-group full-width">
                    <label for="editImmunities">Иммунитеты к урону (через запятую)</label>
                    <input type="text" id="editImmunities" name="immunities" placeholder="яд, психическое воздействие">
                </div>

                <div class="form-group full-width">
                    <label for="editConditionImmunities">Иммунитеты к состояниям (через запятую)</label>
                    <input type="text" id="editConditionImmunities" name="conditionImmunities" placeholder="испуг, очарование, отравление">
                </div>

                <div class="form-group full-width">
                    <label for="editSenses">Чувства</label>
                    <input type="text" id="editSenses" name="senses" placeholder="тёмное зрение 60 фт, пассивное Восприятие 13">
                </div>

                <div class="form-group full-width">
                    <label for="editLanguages">Языки</label>
                    <input type="text" id="editLanguages" name="languages" placeholder="Общий, Драконий, Телепатия 120 фт">
                </div>

                <div class="form-group full-width">
                    <label for="editTraits">Особенности (Traits)</label>
                    <textarea id="editTraits" name="traits" rows="6" placeholder="Невидимость | Мейфайт невидим…"></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="editActions">Действия (Actions)</label>
                    <textarea id="editActions" name="actions" rows="8" placeholder="Мультиатака | Мейфайт совершает три атаки…"></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="editLegendary">Легендарные действия</label>
                    <textarea id="editLegendary" name="legendary" rows="4" placeholder="Атака | Мейфайт совершает одну атаку когтем. | 1"></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="editLairActions">Действия логова</label>
                    <textarea id="editLairActions" name="lairActions" rows="3" placeholder=""></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="editRegionalEffects">Региональные эффекты</label>
                    <textarea id="editRegionalEffects" name="regionalEffects" rows="3" placeholder=""></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="editPromptOverride">Кастомный промпт (опционально)</label>
                    <textarea id="editPromptOverride" name="promptOverride" rows="4" placeholder="Оставьте пустым для автогенерации"></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="editNegativePrompt">Negative Prompt</label>
                    <textarea id="editNegativePrompt" name="negativePrompt" rows="3" placeholder="Оставьте пустым для автогенерации"></textarea>
                </div>
            </div>
            <footer class="modal-footer">
                <button type="button" class="btn btn-secondary" id="modalCancel">Отмена</button>
                <button type="submit" class="btn btn-primary" id="modalSave">Сохранить</button>
            </footer>
            <input type="hidden" name="id" id="editId">
            <input type="hidden" name="isNew" id="editIsNew" value="true">
        </form>
    </dialog>

    <!-- Toast уведомления -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>
</html>
